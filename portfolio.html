<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: url("https://file.garden/Z3nf4eZzZUtRPfhK/free%20layout%20assets/breezy/ef8z6y.png");
    }

    .container {
      width: 95%;
      max-width: 1024px;
      margin: 20px auto;
      padding: 10px;
      background: linear-gradient(0deg, rgba(176,198,230,1) 0%, rgba(215,230,252,1) 44%, rgba(246,254,255,1) 100%);
      border: 3px solid #a5b8e6;
      border-radius: 15px;
    }

    .banner {
      height: 150px;
      border-radius: 10px;
      margin-bottom: 15px;
      background-image: url('https://file.garden/Z3nf4eZzZUtRPfhK/free%20layout%20assets/breezy/hrhr7y.gif');
      background-size: cover;
      background-position: center;
    }

    .main-content {
      display: flex;
      justify-content: space-between;
    }

    .content {
      width: 65%;
      padding: 20px;
      background: #ffffff;
      border-radius: 10px;
    }

    .navigation {
      width: 30%;
      padding: 20px;
      background: #f8faff;
      border-radius: 10px;
    }

    .navigation ul {
      list-style: none;
      padding: 0;
    }

    .navigation a {
      text-decoration: none;
      color: #5c8cc6;
      font-weight: bold;
    }

    .card {
      margin-bottom: 20px;
    }

    /* GRID GALLERY */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .project-card {
      background-color: #ffffff;
      border: 2px solid #a5b8e6;
      border-radius: 10px;
      padding: 15px;
    }

    .project-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .project-card h2 {
      margin: 0 0 10px 0;
      color: #0071a6;
    }

    .project-card p {
      font-size: 0.9em;
    }

    .project-card a {
      color: #4bc1c9;
      font-weight: bold;
      text-decoration: none;
    }

    .project-category {
      margin-top: 25px;
      font-size: 1.5em;
      color: #0071a6;
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Banner -->
    <div class="banner"></div>

    <div class="main-content">

      <!-- CONTENT -->
      <div class="content">
        <div class="card">
          <h1>My Portfolio</h1>
          <p>Here are some of my projects!</p>

          <h2 class="project-category">Art Projects</h2>
          <div class="gallery-grid">
            <div class="project-card">
              <img src="images/art1.png">
              <h2>Art Project 1</h2>
              <p>Description here</p>
              <a href="projects/art1.html">View Project</a>
            </div>

            <div class="project-card">
              <img src="images/art2.png">
              <h2>Art Project 2</h2>
              <p>Description here</p>
              <a href="projects/art2.html">View Project</a>
            </div>
          </div>

          <h2 class="project-category">Game Projects</h2>
          <div class="gallery-grid">
            <div class="project-card">
              <img src="images/game1.png">
              <h2>Game Project</h2>
              <p>Description here</p>
              <a href="projects/game1.html">View Project</a>
            </div>
          </div>

        </div>
      </div>

      <!-- NAVIGATION -->
      <div class="navigation">
        <h2>Navigation</h2>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="guestbook.html">Guestbook</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
        </ul>
      </div>

    </div>
  </div>
</body>
</html>
